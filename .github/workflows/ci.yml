name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  INSTA_UPDATE: no

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv
      - name: Format check
        run: cargo fmt --all -- --check

  check-and-test:
    name: Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv
          echo "::add-matcher::.github/rust-matcher.json"
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  sdk:
    name: SDK Build, Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        run: |
          rustup show active-toolchain
          rustc -Vv
          echo "::add-matcher::.github/rust-matcher.json"
      - uses: Swatinem/rust-cache@v2
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Install JS dependencies
        run: vp install
      - name: Build native addon and SDK
        run: vp run -r build
      - name: Build Compact CLI for e2e
        run: vp run build:cli
      - name: Vite+ Check
        run: vp check
      - name: Vite+ Test
        run: vp test
